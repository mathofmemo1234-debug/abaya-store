<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم دار الغيد</title>
    <!-- خط Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --border: #333333;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-gold: #c59b27;
            --accent-gold-hover: #a37f1e;
            --red-error: #ef4444;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* شاشة تسجيل الدخول */
        #login-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .login-card h2 {
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            font-size: 1.75rem;
        }

        .login-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
            color: var(--text-secondary);
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #2a2a2a;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent-gold);
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background: var(--accent-gold);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background: var(--accent-gold-hover);
        }

        #error-msg {
            color: var(--red-error);
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }

        /* لوحة التحكم (تظهر بعد تسجيل الدخول) */
        #dashboard-screen {
            display: none;
            padding: 2rem;
            width: 100%;
            max-width: 1200px;
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen">
        <div class="login-card">
            <h2>لوحة تحكم دار الغيد</h2>
            <p>يرجى تسجيل الدخول للتحكم بعناصر المتجر</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني للإدارة *</label>
                    <input type="email" id="email" required placeholder="mathofmemo1234@gmail.com">
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور *</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-submit">🔒 تسجيل الدخول</button>
            </form>

            <div id="error-msg"></div>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="dashboard-screen">
        <h2>مرحباً بك في لوحة التحكم</h2>
        <p>تم تسجيل الدخول بنجاح!</p>
        <button id="logout-btn" style="padding: 0.5rem 1rem; margin-top: 1rem; background: #ef4444; color: #fff; border: none; border-radius: 6px; cursor: pointer;">تسجيل الخروج</button>
    </div>

    <!-- 1. استدعاء مكتبات Firebase SDK المطلوبة -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- 2. استدعاء ملف التهيئة firebase-config.js (يحتوي على الـ apiKey الصحيح) -->
    <script src="firebase-config.js"></script>

    <!-- 3. كود الجافاسكربت الخاص بالصفحة لتسجيل الدخول -->
    <script>
        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');
        const loginScreen = document.getElementById('login-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const logoutBtn = document.getElementById('logout-btn');

        // مراقبة حالة تسجيل الدخول تلقائياً
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                loginScreen.style.display = 'none';
                dashboardScreen.style.display = 'block';
            } else {
                loginScreen.style.display = 'flex';
                dashboardScreen.style.display = 'none';
            }
        });

        // التعامل مع نموذج تسجيل الدخول عند الضغط
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            errorMsg.innerText = '';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            firebase.auth().signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // تم تسجيل الدخول بنجاح
                    console.log("Logged in successfully:", userCredential.user);
                })
                .catch((error) => {
                    console.error("Login Error:", error);
                    errorMsg.style.display = 'block';
                    errorMsg.innerText = `❌ خطأ في تسجيل الدخول: ${error.message}`;
                });
        });

        // تسجيل الخروج
        logoutBtn.addEventListener('click', () => {
            firebase.auth().signOut();
        });
    </script>
</body>
</html>
